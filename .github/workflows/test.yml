name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/skill-governance/scripts/skill_governance.py

  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exactly one installable Skill
        shell: bash
        run: |
          output="$(npx -y skills add . --list)"
          echo "$output"
          test "$(printf '%s' "$output" | grep -c 'skill-governance')" -ge 1
          test "$(find . -name SKILL.md -type f | wc -l)" -eq 1
      - name: Verify repeated global installation stays singular
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/skill-governance-home"
          mkdir -p "$HOME/.codex"
          npx -y skills add . -g --skill skill-governance --agent codex -y
          npx -y skills add . -g --skill skill-governance --agent codex -y
          test "$(find "$HOME/.agents/skills" -maxdepth 1 -type d -name skill-governance | wc -l)" -eq 1
          npx -y skills list -g --json
